@if (svc.config(); as cfg) {
  <div class="dialog-root" role="presentation">
    <div class="dialog__overlay" (click)="cancel()"></div>

    <div class="dialog__card" role="alertdialog" aria-modal="true" [attr.aria-label]="cfg.title">

      @if (step() === 1) {
        <!-- ── Paso 1: Primera confirmación ── -->
        <div class="dialog__icon dialog__icon--warn" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        </div>

        <h2 class="dialog__title">{{ cfg.title }}</h2>
        <p class="dialog__message">{{ cfg.message }}</p>

        @if (cfg.entityName) {
          <div class="dialog__entity">{{ cfg.entityName }}</div>
        }

        <div class="dialog__actions">
          <button class="btn btn--ghost" (click)="cancel()">Cancelar</button>
          <button class="btn btn--warn" (click)="next()">Continuar</button>
        </div>

      } @else {
        <!-- ── Paso 2: Segunda confirmación (destructiva) ── -->
        <div class="dialog__icon dialog__icon--danger" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            <path d="M10 11v6"/><path d="M14 11v6"/>
            <path d="M9 6V4h6v2"/>
          </svg>
        </div>

        <h2 class="dialog__title dialog__title--danger">Confirmar eliminación</h2>
        <p class="dialog__message">Esta acción es <strong>irreversible</strong>. El elemento será eliminado permanentemente del sistema.</p>

        <div class="dialog__actions">
          <button class="btn btn--ghost" (click)="cancel()">Cancelar</button>
          <button class="btn btn--danger" (click)="confirm()">Sí, eliminar definitivamente</button>
        </div>
      }

    </div>
  </div>
}
