<div class="login-container">
  <div class="background-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="login-card">
    <div class="back-btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </div>

    <header class="login-header">
      <div class="icon-box">
        <div class="main-icon">
          <span>🌿</span>
        </div>
        <div class="badge">✦</div>
      </div>

      <div class="step-pills">
        <div class="pill active"></div>
        <div class="pill"></div>
      </div>

      <h1>GastroMind</h1>
      <p>Panel de Administración</p>
    </header>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-field">
        <label>USUARIO</label>
        <div class="input-group">
          <input 
            type="text" 
            formControlName="username" 
            placeholder="Tu nombre de usuario"
            [class.invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched"
          >
          <i class="icon-user">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </i>
        </div>
      </div>

      <div class="form-field">
        <label>CONTRASEÑA</label>
        <div class="input-group">
          <input 
            type="password" 
            formControlName="password" 
            placeholder="••••••••"
            [class.invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          >
          <i class="icon-lock">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </i>
        </div>
      </div>

      <div *ngIf="errorMessage" class="error-msg">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
        <span>{{ errorMessage }}</span>
      </div>

      <button type="submit" class="submit-btn" [disabled]="loginForm.invalid || isLoading">
        <span *ngIf="!isLoading">Continuar</span>
        <div *ngIf="isLoading" class="loader"></div>
        <svg *ngIf="!isLoading" class="btn-arrow" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-7-7 7 7-7 7"/></svg>
      </button>
    </form>
  </div>
</div>
