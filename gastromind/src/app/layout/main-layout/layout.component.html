<div class="layout">
  <!-- Sidebar -->
  <app-sidebar />

  <div class="layout__main">
    <!-- ── Topbar ──────────────────────────────────────────────────────── -->
    <header class="topbar">

      <!-- Burger (solo mobile) -->
      <button class="topbar__burger" (click)="openMobile()" aria-label="Abrir menú">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6"  x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      <!-- Buscador -->
      <div class="topbar__search">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
             stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="search" placeholder="Buscar usuarios, hogares, tickets…"
               aria-label="Buscar en la plataforma"/>
      </div>

      <!-- ── Avatar + Dropdown ─────────────────────────────────────────── -->
      <div class="topbar__user">

        <button
          class="avatar-btn"
          (click)="toggleMenu()"
          [attr.aria-expanded]="menuOpen()"
          aria-haspopup="true"
          aria-label="Menú de usuario"
        >
          <span class="avatar-btn__initials">{{ userInitials() }}</span>
          @if (user()) {
            <span class="avatar-btn__name">{{ user()!.name }}</span>
          }
          <!-- Chevron -->
          <svg class="avatar-btn__chevron" [class.avatar-btn__chevron--open]="menuOpen()"
               viewBox="0 0 24 24" width="14" height="14" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
               aria-hidden="true">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>

        <!-- Dropdown -->
        @if (menuOpen()) {
          <!-- Overlay invisible para cerrar al hacer clic fuera -->
          <div class="menu-overlay" (click)="closeMenu()" aria-hidden="true"></div>

          <div class="user-menu" role="menu" aria-label="Opciones de usuario">
            <!-- Info del usuario -->
            <div class="user-menu__header">
              <div class="user-menu__avatar" aria-hidden="true">{{ userInitials() }}</div>
              <div class="user-menu__info">
                @if (user()) {
                  <strong>{{ user()!.name }}</strong>
                  <span>{{ user()!.email }}</span>
                  <span class="user-menu__role">{{ user()!.role }}</span>
                } @else {
                  <strong>Cargando…</strong>
                }
              </div>
            </div>

            <div class="user-menu__divider" role="separator"></div>

            <!-- Logout -->
            <button
              class="user-menu__action user-menu__action--danger"
              (click)="logout()"
              role="menuitem"
            >
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round"
                   stroke-linejoin="round" aria-hidden="true">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
              </svg>
              Cerrar sesión
            </button>
          </div>
        }
      </div>

    </header>

    <!-- Contenido enrutado -->
    <main class="layout__content">
      <router-outlet />
    </main>
  </div>

  <!-- Modal global (glassmorphism) -->
  <app-modal />

  <!-- Toast notifications -->
  <app-toast />

  <!-- Confirm dialog (doble confirmación) -->
  <app-confirm-dialog />
</div>
