<div class="layout">
  <!-- Sidebar: componente reutilizable -->
  <app-sidebar />

  <div class="layout__main">
    <!-- Topbar inline: ligera, evitamos crear componente adicional si
         la app aún no necesita variantes. Se puede extraer cuando crezca. -->
    <header class="topbar">
      <button class="topbar__burger" (click)="openMobile()" aria-label="Abrir menú">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>

      <div class="topbar__search">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input type="search" placeholder="Buscar usuarios, hogares, tickets…" />
      </div>

      <div class="topbar__user">
        <div class="user-chip">
          <div class="user-chip__avatar">{{ user().initial }}</div>
          <div class="user-chip__meta">
            <strong>{{ user().name }}</strong>
            <span>{{ user().email }}</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Contenido de cada feature -->
    <main class="layout__content">
      <router-outlet />
    </main>
  </div>
  <app-sidebar />
</div>
